<g opacity=".28" fill="none" stroke="#5A3B6B" stroke-width="1.5">
  <ellipse cx="450" cy="1010" rx="330" ry="52"/><ellipse cx="450" cy="1010" rx="250" ry="38"/>
</g>
<ellipse cx="470" cy="1022" rx="212.5" ry="34" fill="#301C3D" opacity=".22" filter="url(#softmidnightbloommist)"/>
<g>
  
  <rect x="420" y="352" width="60" height="120" rx="8" fill="#C6AFD0" opacity=".55"/>
  <rect x="404" y="310" width="92" height="58" rx="14" fill="url(#capmidnightbloommist)"/>
  <rect x="428" y="294" width="44" height="22" rx="7" fill="#301C3D" opacity=".85"/>
  <rect x="325" y="470" width="250" height="560" rx="44" fill="url(#glassmidnightbloommist)"/>
  <rect x="339" y="486" width="26" height="514" rx="13" fill="#fff" opacity=".55"/>
  <rect x="529" y="510" width="14" height="450" rx="7" fill="#fff" opacity=".3"/>
