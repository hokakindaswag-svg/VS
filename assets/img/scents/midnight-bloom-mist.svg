<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="MIDNIGHT BLOOM">
<defs>
  <linearGradient id="bggmidnightbloommist" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#FFFDFB"/><stop offset="55%" stop-color="#E0D3E4"/><stop offset="100%" stop-color="#5A3B6B22"/>
  </linearGradient>
  <radialGradient id="flashmidnightbloommist" cx="50%" cy="28%" r="62%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/><stop offset="60%" stop-color="#ffffff" stop-opacity=".12"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glassmidnightbloommist" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/><stop offset="18%" stop-color="#C6AFD0"/><stop offset="52%" stop-color="#5A3B6B"/><stop offset="78%" stop-color="#C6AFD0"/><stop offset="100%" stop-color="#ffffff" stop-opacity=".8"/>
  </linearGradient>
  <linearGradient id="capmidnightbloommist" x1="0" y1="0" x2="1" y2="0">
