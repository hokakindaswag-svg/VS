  <text x="450" y="715" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="2" fill="#301C3D">BLOOM</text>
  <line x1="395" y1="742" x2="505" y2="742" stroke="#5A3B6B" stroke-width="1.2" opacity=".6"/>
  <text x="450" y="776" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#5A3B6B">BRUME PARFUMÉE</text>
