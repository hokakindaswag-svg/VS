<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="PURE SEDUCTION">
<defs>
  <linearGradient id="bggpureseductionmist" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#FFFDFB"/><stop offset="55%" stop-color="#F9D3DF"/><stop offset="100%" stop-color="#B22C5722"/>
  </linearGradient>
  <radialGradient id="flashpureseductionmist" cx="50%" cy="28%" r="62%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/><stop offset="60%" stop-color="#ffffff" stop-opacity=".12"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glasspureseductionmist" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/><stop offset="18%" stop-color="#F2AEC4"/><stop offset="52%" stop-color="#B22C57"/><stop offset="78%" stop-color="#F2AEC4"/><stop offset="100%" stop-color="#ffffff" stop-opacity=".8"/>
  </linearGradient>
  <!-- Finition tube métallique dégradée, façon vernis satiné -->
  <linearGradient id="metalpureseductionmist" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".9"/>
    <stop offset="16%" stop-color="#F2AEC4"/>
    <stop offset="48%" stop-color="#B22C57"/>
    <stop offset="78%" stop-color="#6E1730"/>
    <stop offset="100%" stop-color="#B22C57"/>
  </linearGradient>
  <linearGradient id="cappureseductionmist" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F7F2EE"/><stop offset="35%" stop-color="#D9B27C"/><stop offset="70%" stop-color="#B4884A"/><stop offset="100%" stop-color="#F1DDBB"/>
  </linearGradient>
  <linearGradient id="capvpureseductionmist" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F1DDBB"/><stop offset="45%" stop-color="#D9B27C"/><stop offset="100%" stop-color="#A87A3E"/>
  </linearGradient>
  <!-- Reflet diagonal façon studio, commun aux deux formats -->
  <linearGradient id="sheenpureseductionmist" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="38%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="47%" stop-color="#ffffff" stop-opacity=".55"/>
    <stop offset="56%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="grainpureseductionmist"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer></filter>
  <filter id="softpureseductionmist" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter></defs>
<rect width="900" height="1200" fill="url(#bggpureseductionmist)"/>
<ellipse cx="450" cy="330" rx="330" ry="330" fill="url(#flashpureseductionmist)"/>
<g opacity=".28" fill="none" stroke="#B22C57" stroke-width="1.5">
  <ellipse cx="450" cy="1090" rx="330" ry="52"/><ellipse cx="450" cy="1090" rx="250" ry="38"/>
</g>
<ellipse cx="470" cy="1100" rx="212.5" ry="34" fill="#6E1730" opacity=".22" filter="url(#softpureseductionmist)"/>
<g>
  
  <rect x="416" y="320" width="68" height="152" rx="10" fill="#F2AEC4" opacity=".5"/>
  <rect x="400" y="272" width="100" height="62" rx="20" fill="url(#cappureseductionmist)"/>
  <rect x="398" y="298" width="104" height="16" fill="#6E1730" opacity=".92"/>
  <text x="450" y="309" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" letter-spacing="2" fill="#EFCE93">MAISON ROSÉ</text>
  <rect x="456" y="256" width="46" height="20" rx="7" fill="#6E1730" opacity=".85" transform="rotate(-6 456 256)"/>
  <rect x="325" y="470" width="250" height="560" rx="46" fill="url(#glasspureseductionmist)"/>
  <rect x="325" y="470" width="250" height="560" rx="46" fill="url(#sheenpureseductionmist)"/>
  <rect x="341" y="488" width="22" height="510" rx="11" fill="#fff" opacity=".5"/>
  <rect x="351" y="620" width="198" height="250" rx="12" fill="#FFFBF7" opacity=".94"/>
  <text x="450" y="658" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="3" fill="#B22C57">MAISON ROSÉ</text>
  <text x="450" y="695" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="1.5" fill="#6E1730">PURE</text>
  <text x="450" y="733" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="1.5" fill="#6E1730">SEDUCTION</text>
  <line x1="395" y1="758" x2="505" y2="758" stroke="#B22C57" stroke-width="1.2" opacity=".6"/>
  <text x="450" y="790" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="3" fill="#B22C57">BRUME PARFUMÉE</text>
  <text x="450" y="820" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="2.2" fill="#6E1730" opacity=".65">FRUITÉ · SUCRÉ · SENSUEL</text>
  <text x="450" y="1004" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#6E1730" opacity=".55">250 ML</text>
</g>
<rect width="900" height="1200" filter="url(#grainpureseductionmist)" opacity=".5" style="mix-blend-mode:multiply"/>
</svg>