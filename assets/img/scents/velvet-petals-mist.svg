<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="VELVET PETALS">
<defs>
  <linearGradient id="bggvelvetpetalsmist" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#FFFDFB"/><stop offset="55%" stop-color="#EFDCEC"/><stop offset="100%" stop-color="#A2678F22"/>
  </linearGradient>
  <radialGradient id="flashvelvetpetalsmist" cx="50%" cy="28%" r="62%">
