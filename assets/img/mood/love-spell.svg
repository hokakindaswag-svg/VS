<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
<defs>
  <linearGradient id="bggmlovespell" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#FFFDFB"/><stop offset="55%" stop-color="#FBD5CB"/><stop offset="100%" stop-color="#D4425A22"/>
  </linearGradient>
  <radialGradient id="flashmlovespell" cx="50%" cy="28%" r="62%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/><stop offset="60%" stop-color="#ffffff" stop-opacity=".12"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glassmlovespell" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/><stop offset="18%" stop-color="#F7B8AA"/><stop offset="52%" stop-color="#D4425A"/><stop offset="78%" stop-color="#F7B8AA"/><stop offset="100%" stop-color="#ffffff" stop-opacity=".8"/>
  </linearGradient>
  <!-- Finition tube métallique dégradée, façon vernis satiné -->
  <linearGradient id="metalmlovespell" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".9"/>
    <stop offset="16%" stop-color="#F7B8AA"/>
    <stop offset="48%" stop-color="#D4425A"/>
    <stop offset="78%" stop-color="#7B2233"/>
    <stop offset="100%" stop-color="#D4425A"/>
  </linearGradient>
  <linearGradient id="capmlovespell" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F7F2EE"/><stop offset="35%" stop-color="#D9B27C"/><stop offset="70%" stop-color="#B4884A"/><stop offset="100%" stop-color="#F1DDBB"/>
  </linearGradient>
  <linearGradient id="capvmlovespell" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F1DDBB"/><stop offset="45%" stop-color="#D9B27C"/><stop offset="100%" stop-color="#A87A3E"/>
  </linearGradient>
  <!-- Reflet diagonal façon studio, commun aux deux formats -->
  <linearGradient id="sheenmlovespell" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="38%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="47%" stop-color="#ffffff" stop-opacity=".55"/>
    <stop offset="56%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="grainmlovespell"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer></filter>
  <filter id="softmlovespell" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter></defs>
<rect width="800" height="1000" fill="url(#bggmlovespell)"/>
<ellipse cx="400" cy="300" rx="380" ry="340" fill="url(#flashmlovespell)"/>
<g opacity=".5">
  <circle cx="230" cy="740" r="150" fill="#D4425A" opacity=".22" filter="url(#softmlovespell)"/>
  <circle cx="600" cy="420" r="190" fill="#F7B8AA" opacity=".5" filter="url(#softmlovespell)"/>
</g>
<g transform="translate(400 520)" opacity=".9">
  <ellipse cx="0" cy="-120" rx="58" ry="140" fill="#D4425A" opacity=".18" transform="rotate(0)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#D4425A" opacity=".18" transform="rotate(45)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#D4425A" opacity=".18" transform="rotate(90)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#D4425A" opacity=".18" transform="rotate(135)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#D4425A" opacity=".18" transform="rotate(180)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#D4425A" opacity=".18" transform="rotate(225)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#D4425A" opacity=".18" transform="rotate(270)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#D4425A" opacity=".18" transform="rotate(315)"/>
  <circle r="46" fill="#F7B8AA"/><circle r="22" fill="#D4425A" opacity=".55"/>
</g>
<rect x="60" y="60" width="680" height="880" fill="none" stroke="#FFFDFB" stroke-width="2" opacity=".7"/>
<rect width="800" height="1000" filter="url(#grainmlovespell)" opacity=".55" style="mix-blend-mode:multiply"/>
</svg>