<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
<defs>
  <linearGradient id="bggmamberromance" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#FFFDFB"/><stop offset="55%" stop-color="#F2DCC5"/><stop offset="100%" stop-color="#9A5B2E22"/>
  </linearGradient>
  <radialGradient id="flashmamberromance" cx="50%" cy="28%" r="62%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/><stop offset="60%" stop-color="#ffffff" stop-opacity=".12"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glassmamberromance" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/><stop offset="18%" stop-color="#E5BE92"/><stop offset="52%" stop-color="#9A5B2E"/><stop offset="78%" stop-color="#E5BE92"/><stop offset="100%" stop-color="#ffffff" stop-opacity=".8"/>
  </linearGradient>
  <!-- Finition tube métallique dégradée, façon vernis satiné -->
  <linearGradient id="metalmamberromance" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".9"/>
    <stop offset="16%" stop-color="#E5BE92"/>
    <stop offset="48%" stop-color="#9A5B2E"/>
    <stop offset="78%" stop-color="#5A3117"/>
    <stop offset="100%" stop-color="#9A5B2E"/>
  </linearGradient>
  <linearGradient id="capmamberromance" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F7F2EE"/><stop offset="35%" stop-color="#D9B27C"/><stop offset="70%" stop-color="#B4884A"/><stop offset="100%" stop-color="#F1DDBB"/>
  </linearGradient>
  <linearGradient id="capvmamberromance" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F1DDBB"/><stop offset="45%" stop-color="#D9B27C"/><stop offset="100%" stop-color="#A87A3E"/>
  </linearGradient>
  <!-- Reflet diagonal façon studio, commun aux deux formats -->
  <linearGradient id="sheenmamberromance" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="38%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="47%" stop-color="#ffffff" stop-opacity=".55"/>
    <stop offset="56%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="grainmamberromance"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer></filter>
  <filter id="softmamberromance" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter></defs>
<rect width="800" height="1000" fill="url(#bggmamberromance)"/>
<ellipse cx="400" cy="300" rx="380" ry="340" fill="url(#flashmamberromance)"/>
<g opacity=".5">
  <circle cx="230" cy="740" r="150" fill="#9A5B2E" opacity=".22" filter="url(#softmamberromance)"/>
  <circle cx="600" cy="420" r="190" fill="#E5BE92" opacity=".5" filter="url(#softmamberromance)"/>
</g>
<g transform="translate(400 520)" opacity=".9">
  <ellipse cx="0" cy="-120" rx="58" ry="140" fill="#9A5B2E" opacity=".18" transform="rotate(0)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#9A5B2E" opacity=".18" transform="rotate(45)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#9A5B2E" opacity=".18" transform="rotate(90)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#9A5B2E" opacity=".18" transform="rotate(135)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#9A5B2E" opacity=".18" transform="rotate(180)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#9A5B2E" opacity=".18" transform="rotate(225)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#9A5B2E" opacity=".18" transform="rotate(270)"/><ellipse cx="0" cy="-120" rx="58" ry="140" fill="#9A5B2E" opacity=".18" transform="rotate(315)"/>
  <circle r="46" fill="#E5BE92"/><circle r="22" fill="#9A5B2E" opacity=".55"/>
</g>
<rect x="60" y="60" width="680" height="880" fill="none" stroke="#FFFDFB" stroke-width="2" opacity=".7"/>
<rect width="800" height="1000" filter="url(#grainmamberromance)" opacity=".55" style="mix-blend-mode:multiply"/>
</svg>